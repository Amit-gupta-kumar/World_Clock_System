<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple World Clock</title>
  <link rel="stylesheet" href="Demo.css">
</head>
<body id="wc-root">

  <div id="wc-header">
    <h1 class="wc-title">World Clock</h1>
    <div id="master-time" class="wc-clock-big">--:--:--</div>
    <div id="master-date" class="wc-date-small">Date Goes Here</div>
  </div>

  <div class="wc-controls">
    <input type="text" id="search-box" placeholder="Search city..." oninput="filterCards()">
    <select id="fmt-select" onchange="renderCards()">
      <option value="24">24h Format</option>
      <option value="12">12h Format</option>
    </select>
  </div>

  <div id="wc-grid" class="wc-grid"></div>

  <div id="fs-overlay" class="fs-hidden">
    <button id="fs-close-btn" onclick="closeFullscreen()">✕ Close</button>
    <div id="fs-city-name">City Name</div>
    <div id="fs-country-name">Country Name</div>
    <div id="fs-big-time">00:00:00</div>
    <div id="fs-big-date">Date Goes Here</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
